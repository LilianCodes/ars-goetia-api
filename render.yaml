services:
  - type: web
    name: ars-goetia-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r src/requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: src
